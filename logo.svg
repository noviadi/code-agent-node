<svg width="100%" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      .text { font-family: 'JetBrains Mono', monospace; }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
  </defs>

  <!-- Main container -->
  <rect x="10" y="10" width="580" height="130" rx="12" fill="url(#bg)" stroke="#444" stroke-width="1"/>
  
  <!-- Window controls -->
  <circle cx="35" cy="35" r="6" fill="#ff5f56"/>
  <circle cx="55" cy="35" r="6" fill="#ffbd2e"/>
  <circle cx="75" cy="35" r="6" fill="#27c93f"/>
  
  <!-- Content -->
  <text x="40" y="80" fill="#e6e6e6" font-size="28" font-weight="700" class="text">
    <tspan fill="#68a063">&gt;</tspan> code-agent-node
  </text>
  
  <text x="40" y="110" fill="#888" font-size="16" class="text">
    running... [Node.js + Claude]
  </text>

  <!-- Blinking cursor -->
  <rect x="340" y="58" width="12" height="26" fill="#68a063" class="cursor"/>
  
  <!-- Decorative elements -->
  <path d="M520 40 L560 40 L560 80" stroke="#444" stroke-width="2" fill="none"/>
  <rect x="540" y="100" width="20" height="20" fill="#333" stroke="#444"/>
</svg>
